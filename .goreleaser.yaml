version: 2
before:
  hooks:
    - go mod download
archives:
  - id: darwin
    ids:
      - darwin
    formats:
      - zip
  - id: linux
    ids:
      - linux
    formats:
      - zip
  - id: windows
    ids:
      - windows
    formats:
      - zip
homebrew_casks:
  - ids:
      - darwin
    binaries:
      - "{{.ProjectName}}"
    homepage: "https://github.com/atcprojectio/atc"
    description: "Active Traffic Control (ATC) automatic Consul traffic control and failover agent."
    # Do not publish pre-releases to Homebrew users.
    skip_upload: auto
    repository:
      owner: atcprojectio
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
builds:
  - id: darwin
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X "github.com/prometheus/common/version.Revision={{.ShortCommit}}"
      - -X "github.com/prometheus/common/version.Branch={{.Branch}}"
      - -X "github.com/prometheus/common/version.BuildDate={{.Date}}"
      - -X "github.com/prometheus/common/version.Version={{.Version}}"
  - id: linux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X "github.com/prometheus/common/version.Revision={{.ShortCommit}}"
      - -X "github.com/prometheus/common/version.Branch={{.Branch}}"
      - -X "github.com/prometheus/common/version.BuildDate={{.Date}}"
      - -X "github.com/prometheus/common/version.Version={{.Version}}"
  - id: windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X "github.com/prometheus/common/version.Revision={{.ShortCommit}}"
      - -X "github.com/prometheus/common/version.Branch={{.Branch}}"
      - -X "github.com/prometheus/common/version.BuildDate={{.Date}}"
      - -X "github.com/prometheus/common/version.Version={{.Version}}"
dockers_v2:
  - images:
      - "ghcr.io/atcprojectio/{{.ProjectName}}"
    # Versioning (see docs "Versioning"): git tags are vX.Y.Z, every artifact uses X.Y.Z.
    # The floating tags (X.Y, X, latest) only move for full releases, never for
    # pre-releases (vX.Y.Z-rc.N) or nightlies. Empty tags are skipped.
    tags:
      - "{{ .Version }}"
      - "{{ if and (not .Prerelease) (not .IsNightly) }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if and (not .Prerelease) (not .IsNightly) }}{{ .Major }}{{ end }}"
      - "{{ if and (not .Prerelease) (not .IsNightly) }}latest{{ end }}"
    labels:
      "org.opencontainers.image.description": "Active Traffic Control (ATC) automatic Consul traffic control and failover agent."
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.ShortCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
nfpms:
  - id: linux
    maintainer: 'bram vogelaar <bram@attachmentgenie.com>'
    homepage: "https://github.com/atcprojectio/atc"
    description: "Active Traffic Control (ATC) automatic Consul traffic control and failover agent."
    package_name: "{{.ProjectName}}"
    ids:
      - linux
    formats:
      - deb
      - rpm
sboms:
  - artifacts: archive
release:
  prerelease: auto
  header: |
    ATC is versioned as `X.Y.Z` (this release is tagged `{{ .Tag }}` in git).
    Before 1.0, minor releases may contain breaking changes; they are listed under
    **Breaking changes** below. See https://atc-project.io/#versioning
checksum:
  name_template: 'checksums.txt'
snapshot:
  # Plain X.Y.Z like every other artifact, e.g. 0.4.1-next after v0.4.0.
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
  # Commits are squash-merged, so the PR title is the commit subject. Mark breaking
  # changes with "!" in the PR title (e.g. "feat(auth)!: ...") so they get their own
  # section; before 1.0 they ship in minor releases.
  groups:
    - title: "Breaking changes"
      regexp: '^\w+(\([^)]*\))?!:'
      order: 0
    - title: "Features"
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: "Fixes"
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: "Other changes"
      order: 999
