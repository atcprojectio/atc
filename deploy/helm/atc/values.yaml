replicaCount: 2

image:
  repository: ghcr.io/atcprojectio/atc
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# The image is distroless and runs as the "nonroot" user (UID/GID 65532). ATC writes nothing
# to disk (logs go to stdout), so the root filesystem can be read-only.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8088

metricsService:
  type: ClusterIP
  port: 8089

mcpService:
  type: ClusterIP
  port: 8092

# ATC's own Consul ACL token, read from an existing Secret (recommended over putting
# consul_token in strategiesYaml, which is stored in a ConfigMap).
consulToken:
  existingSecret: ""
  key: token

# Extra environment variables for the ATC container, e.g. to enable OpenTelemetry export:
#   extraEnv:
#     - name: OTEL_EXPORTER_OTLP_ENDPOINT
#       value: http://otel-collector.observability.svc:4318
extraEnv: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

config:
  logLevel: info
  # Consul HTTP address. Empty uses the Consul agent on the pod's node
  # (http://<node IP>:8500), the usual setup with Consul client agents. Set it explicitly
  # for agentless/dataplane installs, e.g. "http://consul-server.consul.svc:8500".
  consulAddr: ""
  consulDC: "dc1"
  consulNamespace: ""
  writeRateLimit: "1s"
  dryRun: false
  # Predefined strategies and HA configuration for ATC config file
  strategiesYaml: |
    service: "atc-service"
    ha:
      enabled: true
      lock_key: "atc/leader/lock"
      session_ttl: "15s"
    # Callers must present a Consul ACL token (X-Consul-Token or Authorization: Bearer);
    # ATC uses it for Consul calls, so Consul ACLs decide what each caller may change.
    # To use static API keys instead, add them under static_keys (never commit real keys).
    # ATC refuses to start with auth disabled on a network-reachable address unless
    # allow_unauthenticated: true is set.
    auth:
      enabled: true
      static_keys: []
      consul_token_delegation: true
    dampening_period: "5s"
    min_dampening_period: "1s"
    consul_namespace: ""
    write_rate_limit: "1s"
    dry_run: false
    strategies:
      failover:
        standard-failover:
          connect_timeout: "15s"
          targets:
            - service: "payment-service"
              datacenter: "dc2"
      redirect:
        standard-redirect:
          service: "payment-service"
          datacenter: "dc2"
